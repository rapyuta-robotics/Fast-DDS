name: Build libfastrtps multiarch (Foxy 2.1.4)

# Builds libfastrtps.so.2.1.4 for amd64 + arm64 against ROS 2 Foxy / Ubuntu 20.04,
# so custom-fix branches can be dropped into running production (Jetson=arm64, edge/server=amd64).
on:
  push:
    branches: [ 'rapyuta/**' ]
  pull_request:
    branches: [ 'rapyuta/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest-8-cores        # org larger runner, 8-core x64
          - arch: arm64
            runner: ubuntu-22.04-arm             # free native arm64 hosted (org 8-core-arm64 group not authorized for fork)
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build fastrtps in Foxy container
        run: |
          docker run --rm --platform linux/${{ matrix.arch }} \
            -v "$PWD":/src -w /src \
            ros:foxy-ros-base bash -lc '
              set -eo pipefail
              # SECURITY=ON to match stock ros-foxy-fastrtps ABI: HAVE_SECURITY changes discovery
              # struct layouts (ParticipantProxyData etc.); a SECURITY=OFF lib mismatches the
              # security-ON rmw_fastrtps_shared_cpp -> garbage discovery lengths -> std::bad_alloc
              # in onParticipantDiscovery. Needs libssl-dev for the security plugins.
              apt-get update && apt-get install -y --no-install-recommends libssl-dev
              source /opt/ros/foxy/setup.bash
              mkdir -p build && cd build
              cmake .. -DCMAKE_BUILD_TYPE=Release \
                -DTHIRDPARTY=ON -DTHIRDPARTY_UPDATE=OFF \
                -DCOMPILE_EXAMPLES=OFF -DBUILD_TESTING=OFF -DSECURITY=ON
              make -j"$(nproc)" fastrtps
              echo "=== SONAME / deps ==="
              readelf -d src/cpp/libfastrtps.so.2.1.4 | grep -E "SONAME|NEEDED" || true
              echo "=== ABI guard: SecurityManager symbols must be >0 (match stock Foxy SECURITY=ON) ==="
              sec=$(nm -DC src/cpp/libfastrtps.so.2.1.4 | grep -c SecurityManager || true)
              echo "SecurityManager symbols: $sec"
              if [ "$sec" -eq 0 ]; then echo "ABI MISMATCH: built without SECURITY -> bad_alloc vs Foxy rmw"; exit 1; fi
              md5sum src/cpp/libfastrtps.so.2.1.4
            '

      - name: Stage artifact
        run: |
          mkdir -p out
          cp -av build/src/cpp/libfastrtps.so.2.1.4 out/
          ( cd out && ln -sf libfastrtps.so.2.1.4 libfastrtps.so.2 && ln -sf libfastrtps.so.2 libfastrtps.so )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libfastrtps-${{ matrix.arch }}-foxy-2.1.4
          path: out/
          if-no-files-found: error
