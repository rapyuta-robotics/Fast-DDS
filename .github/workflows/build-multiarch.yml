name: Build libfastrtps multiarch (Foxy 2.1.4)

# Builds libfastrtps.so.2.1.4 for amd64 + arm64 against ROS 2 Foxy / Ubuntu 20.04,
# so custom-fix branches can be dropped into running production (Jetson=arm64, edge/server=amd64).
on:
  push:
    branches: [ 'rapyuta/**' ]
  pull_request:
    branches: [ 'rapyuta/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm   # native arm64 hosted runner (no QEMU; free on public repo)
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build fastrtps in Foxy container
        run: |
          docker run --rm --platform linux/${{ matrix.arch }} \
            -v "$PWD":/src -w /src \
            ros:foxy-ros-base bash -lc '
              set -eo pipefail
              source /opt/ros/foxy/setup.bash
              mkdir -p build && cd build
              cmake .. -DCMAKE_BUILD_TYPE=Release \
                -DTHIRDPARTY=ON -DTHIRDPARTY_UPDATE=OFF \
                -DCOMPILE_EXAMPLES=OFF -DBUILD_TESTING=OFF -DSECURITY=OFF
              make -j"$(nproc)" fastrtps
              echo "=== SONAME / deps ==="
              readelf -d src/cpp/libfastrtps.so.2.1.4 | grep -E "SONAME|NEEDED" || true
              md5sum src/cpp/libfastrtps.so.2.1.4
            '

      - name: Stage artifact
        run: |
          mkdir -p out
          cp -av build/src/cpp/libfastrtps.so.2.1.4 out/
          ( cd out && ln -sf libfastrtps.so.2.1.4 libfastrtps.so.2 && ln -sf libfastrtps.so.2 libfastrtps.so )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libfastrtps-${{ matrix.arch }}-foxy-2.1.4
          path: out/
          if-no-files-found: error
